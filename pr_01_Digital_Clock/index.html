<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Poppins:wght@400;500;600&display=swap');

        * { 
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1a1e2f 0%, #0d1017 100%);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        .center {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 40px 50px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                        0 0 30px rgba(0, 242, 254, 0.15),
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 320px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .center:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6),
                        0 0 40px rgba(0, 242, 254, 0.25);
        }

        #banner {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #94a3b8;
        }

        #banner span {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #clock {
            font-family: 'Orbitron', monospace;
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 3px;
            color: whitesmoke;
            background: rgba(0, 0, 0, 0.35);
            padding: 16px 28px;
            border-radius: 12px;
            border: 1px solid rgb(255, 255, 255);
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="center">
        <div id="banner"><span>Your Local time</span></div>
        <div id="clock"></div>
    </div>
</body>
<script src="script.js"></script>
</html>
