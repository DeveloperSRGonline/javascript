<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async Javascript</title>
</head>
<body>
    <h1>Async Javascript</h1>
    <button id="stop">Stop</button>
</body>
<script>
    // setTimeout(function(){
    //     console.log("Hello World");
    // }, 1000) // it except handler/callback/basically function and another one is timeout number in miliseconds

    const sayIterateSRG = function(){
        console.log('IterateSRG')
    }
    const changeText = function(){
        document.querySelector('h1').innerHTML = 'IterateSRG Updated'
    }

    // setTimeout(sayIterateSRG, 1000)
    const changeMe = setTimeout(changeText, 2000)

    // clearTimeout(changeMe) this is not valid
    document.querySelector('#stop').addEventListener('click',function(){
        clearTimeout(changeMe)
        console.log('Stopped')
    })

</script>
</html>
