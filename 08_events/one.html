    // one real world scenario want to delete image when click on that spedific element

    document.querySelector('#images').addEventListener('click', function (e) {
        let removeIt = e.target.parentNode
        // console.log(e.target)
        if(e.target.tagName === 'IMG'){// when event spill over ho raha that jab galat jagah click kar rahe the isko prevent karne ke liye hum ne strict check lagaya
            removeIt.remove()
        }
    })
